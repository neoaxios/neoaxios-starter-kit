# python-bench Container Definition
#
# Canonical image definition for Python asyncio benchmarks.
# Used by: foundation component load tests.
#
# Runs in idle mode (sleep infinity); the container stays available for
# on-demand invocation by the python-bench engine via docker exec.
#
# Usage (_include directive):
#   docker_images:
#     _include:
#       - python-bench.yaml
#     _deploy_to: all

name: python-bench
image: neoaxios/python-base:latest

# Port binding required by the deploy.yaml ImageSpec schema.
# python-bench does not serve network traffic; this is a no-op binding
# so the provisioner can track the container in its port allocation table.
ports:
  - "18090:18090"

# Clear ENTRYPOINT so command runs as shell script
entrypoint: [""]

volumes:
  # Container log collection (stdout/stderr redirect)
  - "/var/log/neo:/var/log/neo"
  # Benchscript files deployed to hosts for on-demand execution via docker exec
  - "/var/lib/neo/benchscripts:/var/lib/neo/benchscripts"

# Idle pattern: container stays running, runner invokes benchscripts via docker exec
command:
  - "sleep"
  - "infinity"

health_check:
  command: ["python", "--version"]
  initial_timeout: 5
  max_attempts: 5
  backoff_multiplier: 2

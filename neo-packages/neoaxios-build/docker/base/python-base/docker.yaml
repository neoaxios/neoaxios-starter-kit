# NeoAxios foundation Python base image metadata.
#
# Tagged under the ``neoaxios/`` registry namespace; outputs land in
# ``$NEOAXIOS_IMAGE_CACHE`` (default ``~/.cache/neoaxios/.docker-image-cache``).
image:
  name: python-base
  tag: latest
  registry: neoaxios

build:
  base: neoaxios/python:3.12-slim
  context: ../..  # docker/ directory - allows access to scripts/

dependencies:
  wheels:
    # Foundation packages only (see Dockerfile header: "Only FOUNDATION
    # packages — application packages go in app images"). secure_config and
    # neoaxios-logging are inherited from python-slim.
    - neoaxios-config
    - neoaxios-resilience-kit
    - neoaxios-secure-cache
    - neoaxios-fastapi-kit
  images:
    - neoaxios/python:3.12-slim

runtime:
  healthcheck: null
  port: null

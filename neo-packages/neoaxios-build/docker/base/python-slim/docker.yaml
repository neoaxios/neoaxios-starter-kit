# Python slim base image metadata
# Minimal Python base with uv, secure_config, and entrypoint-lib.sh
image:
  name: python
  tag: 3.12-slim
  registry: neoaxios

build:
  base: python:3.12-slim-bookworm
  context: ../..  # docker/ directory - allows access to scripts/

dependencies:
  wheels:
    - neoaxios-secure-config  # For runtime resource detection
    - neoaxios-logging  # Dependency of secure_config
  images: []

runtime:
  healthcheck: null
  port: null

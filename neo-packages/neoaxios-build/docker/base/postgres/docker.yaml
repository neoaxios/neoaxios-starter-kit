# PostgreSQL + PgBouncer co-located image metadata
#
# Combines PostgreSQL 16 with PgBouncer transaction-mode pooling.
# PgBouncer enforces a global connection cap, preventing stale connections
# from crashed containers from exhausting max_connections.
#
# Clients connect to port 6432 (PgBouncer), not 5432 (PostgreSQL direct).
image:
  name: postgres
  tag: latest
  registry: neoaxios

build:
  base: postgres:16-alpine
  context: .

runtime:
  # Generic readiness check — both Postgres (5432) and PgBouncer (6432)
  # accept connections.  The Dockerfile HEALTHCHECK directive does the
  # full check (with a postgres-side validation that defaults to the
  # POSTGRES_USER/DB env vars supplied at runtime).  Downstream images
  # that derive from this base typically override this with a
  # service-specific healthcheck that knows which database to probe.
  healthcheck:
    command: "pg_isready -h 127.0.0.1 -p 6432 -q"
  port: 6432

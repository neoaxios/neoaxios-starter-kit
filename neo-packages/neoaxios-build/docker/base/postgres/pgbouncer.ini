;; PgBouncer configuration for integration-test PostgreSQL
;;
;; Transaction-mode pooling: server connections are returned to the pool
;; after each transaction completes. This allows many clients to share
;; a small number of real PostgreSQL connections.
;;
;; Clients connect to port 6432. PgBouncer proxies to PostgreSQL on 127.0.0.1:5432.

[databases]
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /tmp/pgbouncer-userlist.txt

;; Transaction-mode pooling: connections released after each transaction.
;; Required for multi-host integration testing where containers come and go.
pool_mode = transaction

;; Force DISCARD ALL between pgbouncer server-connection reuses even in
;; transaction mode. Without this, session-level state (notably
;; session-scoped advisory locks acquired via pg_advisory_lock) leaks
;; onto recycled backend connections and reappears on the next client,
;; producing cross-worker deadlocks in bootstrap code that serialises
;; via advisory locks. DISCARD ALL calls pg_advisory_unlock_all so the
;; backend is returned to the pool with a clean session.
server_reset_query = DISCARD ALL
server_reset_query_always = 1

;; Pool sizing
;; default_pool_size: real server connections per user/database pair
;; min_pool_size: pre-open this many server connections per pool (proactive)
;; max_client_conn: maximum simultaneous client connections accepted
;; max_db_connections: hard cap on total server connections per database
default_pool_size = 50
min_pool_size = 50
max_client_conn = 3000
max_db_connections = 100

;; Timeouts
;; server_idle_timeout: close unused server connections after 60s
;; client_idle_timeout: disconnect idle clients after 120s
;; server_connect_timeout: fail fast if PostgreSQL is unresponsive
server_idle_timeout = 60
client_idle_timeout = 120
server_connect_timeout = 5

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Admin access (stats and SHOW commands)
admin_users = postgres
stats_users = postgres

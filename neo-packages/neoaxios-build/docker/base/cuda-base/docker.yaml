# CUDA 12.1 GPU-accelerated base image
# Provides PyTorch with CUDA support and neoaxios tooling
#
# Base: pytorch/pytorch:latest (includes PyTorch 2.x + CUDA 12.1)
# Adds: uv, neoaxios user (UID 997), entrypoint-lib.sh
#
# No wheel dependencies - uses only pytorch base + curl + uv
# Published as ``neoaxios/cuda-base:latest`` in ``$NEOAXIOS_IMAGE_CACHE``
# (default ``~/.cache/neoaxios/.docker-image-cache``).

image:
  name: cuda-base
  tag: latest
  registry: neoaxios

build:
  base: pytorch/pytorch:latest
  context: ../..  # docker/ directory - allows access to scripts/

dependencies:
  wheels: []  # No wheel dependencies - this is a pure base image
  images: []  # No image dependencies - pytorch/pytorch:latest is external

runtime:
  healthcheck: null
  port: null

# NeoAxios Redis base image metadata
#
# Bakes canonical cache config (Tier-1) + cluster overlay (Tier-2) into a
# single image. Runtime topology is selected by REDIS_MODE env var (default:
# cluster). Produced image tag: neoaxios/redis:latest.
# Brought in as a transitive dependency of redis-cluster's deploy manifest.
image:
  name: redis
  tag: latest
  registry: neoaxios

build:
  base: redis:8.0-alpine
  context: .

runtime:
  healthcheck:
    command: "redis-cli -p ${REDIS_PORT:-6379} ping"
  port: 6379

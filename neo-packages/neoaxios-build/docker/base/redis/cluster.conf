# Tier-2 Cluster Overlay — Baked Into neoaxios/redis Image
#
# Layered on top of redis.conf when REDIS_MODE=cluster. The entrypoint
# concatenates redis.conf + cluster.conf into /tmp/redis-effective.conf
# because redis-server accepts exactly ONE positional config file arg;
# additional positional args are parsed as option directives.
#
# Per-node overrides (cluster-announce-ip, cluster-announce-port,
# cluster-announce-bus-port, port, dir, cluster-config-file) are supplied
# via CLI args ("$@") by each deployment — this file covers only the
# cluster-wide settings that are identical across every node.

# -- Cluster enablement --------------------------------------------------
cluster-enabled yes
cluster-node-timeout 5000
cluster-require-full-coverage no
cluster-allow-reads-when-down yes
cluster-migration-barrier 1

# -- Replication backlog -------------------------------------------------
# Large enough to absorb a replica reconnect window without triggering a
# full resync. Sized for the prod 3-master + 3-replica topology.
repl-backlog-size 64mb

# -- Working directory ---------------------------------------------------
# Cluster mode persists nodes.conf (cluster state file) in the working
# directory. The upstream redis:8.0-alpine base image sets WORKDIR to
# /data, which is chown'd to the 'redis' user (UID 999). Rootless
# orchestrators and other rootless-execution paths invoke the container with
# --user <ssh_uid>:<gid> (uid != 999), and redis-server crashes on start
# with "Can't open nodes.conf in order to acquire a lock: Permission
# denied" because UID <ssh_uid> cannot write /data/nodes.conf.
# /var/lib/neo-redis is created world-writable by the Dockerfile so any
# UID can write nodes.conf without mounting a volume. Multi-node prod
# deployments (Nomad 3+3) override with `--dir /persistent/state` so the
# cluster epoch/topology survives container restarts; single-node
# test/dev deployments re-bootstrap slots on start.
dir /var/lib/neo-redis

# Tier-1 Canonical Cache Config — Baked Into neoaxios/redis Image
#
# Single source of truth for cache-workload tuning across every runtime.
# Pure cache workload — all keys use TTL, no durable state (save "",
# appendonly no). Per-instance overrides (--port, --maxmemory, etc.) are
# appended by each deployment via CLI args.
#
# Constraint: cache-only invariant. Do NOT add appendonly yes or rdb save
# directives — those contradict the cache-only design (N-5, N-6).

# -- Connection -----------------------------------------------------------
bind 0.0.0.0 -::1
protected-mode no
maxclients 10000
tcp-backlog 511
timeout 120
tcp-keepalive 60

# -- IO threading (io-threads active on the client port) -----------------
# Vertical scale lever — distributes socket reads/writes across 4 threads.
# Measured ~1,694 RPS gain over the single-threaded baseline at step 1
# under our internal benchmarks. io-threads-do-reads=yes is required for
# reads to be threaded; without it, only writes are threaded.
io-threads 4
io-threads-do-reads yes

# -- Persistence (disabled -- pure cache) --------------------------------
save ""
appendonly no

# -- Memory --------------------------------------------------------------
# Cap at 75% of available RAM per node for the default sizing. Per-node
# overrides are supplied via --maxmemory CLI arg where different sizes
# apply (e.g., 64mb for coordinator, 2gb for scale-test SUT).
maxmemory 768mb

# -- Eviction ------------------------------------------------------------
# LRU across all keys when memory pressure occurs.
# samples 10 gives near-true-LRU accuracy at minimal CPU cost.
maxmemory-policy allkeys-lru
maxmemory-samples 10

# -- Expiry Scan ---------------------------------------------------------
# hz=20 doubles the default scan frequency — expired keys are reclaimed
# faster, reducing memory waste from stale TTL keys. dynamic-hz scales
# up automatically under load.
hz 20
dynamic-hz yes

# -- Non-blocking Eviction -----------------------------------------------
# Large key deletion during eviction/expiry runs in a background thread
# instead of blocking the main event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

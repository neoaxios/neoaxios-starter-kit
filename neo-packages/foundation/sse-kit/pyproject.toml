[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoaxios-sse-kit"
version = "0.2.1"
description = "Server-Sent Events parsing for NeoAxios foundation packages"
requires-python = ">=3.11"
authors = [
    {name = "NeoAxios Engineering", email = "engineering@neoaxios.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "neoaxios-logging>=0.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/neoaxios/neoaxios-starter-kit"
Repository = "https://github.com/neoaxios/neoaxios-starter-kit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neoaxios_sse_kit*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
markers = [
    "unit: marks tests as unit tests (no external dependencies)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

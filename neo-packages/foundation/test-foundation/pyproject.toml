[project]
name = "neoaxios-test-foundation"
version = "0.2.1"
description = "Shared test infrastructure for NeoAxios packages (config, fixtures, mocks)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "flask>=3.0.0",
    "werkzeug>=3.0.6",
    "pyyaml>=6.0.0",
    "paramiko>=3.4.0",
    "redis>=5.0.0",
    "jsonschema>=4.0.0",
    "neoaxios-logging>=0.2.1",
    "neoaxios-secure-cache>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

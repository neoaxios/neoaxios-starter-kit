[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoaxios-secret-store"
version = "0.2.1"
description = "Vault-backed secret store abstraction for distributed Python services with read-through TTL caching, AppRole authentication, and explicit fail-closed semantics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "NeoAxios Engineering", email = "engineering@neoaxios.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "hvac>=2.0.0",
    "neoaxios-secure-cache>=0.2.1",
    "neoaxios-secure-config>=0.2.1",
    "neoaxios-logging>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neoaxios_secret_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

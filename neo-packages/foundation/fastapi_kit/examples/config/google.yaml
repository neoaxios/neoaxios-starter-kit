# Google IAM Configuration Example
#
# This example shows how to configure the authentication framework
# to use Google Identity Platform as the identity provider.
#
# Usage:
#   from neoaxios_fastapi_kit.auth import load_config_from_yaml
#   config = load_config_from_yaml("google.yaml")

# Google IAM Provider Configuration
google:
  # Expected audience claim (your application ID)
  audience: "123456789-abcdefgh.apps.googleusercontent.com"

  # List of allowed email domains for verification (optional)
  allowed_domains:
    - "example.com"
    - "partner.com"

  # Tenant ID for multi-tenancy
  tenant_id: "default-tenant"

  # Google Cloud Platform project ID (optional)
  gcp_project_id: "my-gcp-project"

# Cache Configuration (optional)
cache:
  # Cache backend: "memory" or "redis"
  backend: "memory"

  # Cache TTL in seconds
  ttl_seconds: 300

# Resolver Configuration (optional)
resolver_type: "local"
resolver_merge_strategy: "union"

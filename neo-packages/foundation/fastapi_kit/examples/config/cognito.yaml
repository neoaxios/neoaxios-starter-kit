# AWS Cognito Configuration Example
#
# This example shows how to configure the authentication framework
# to use AWS Cognito User Pools as the identity provider.
#
# Usage:
#   from neoaxios_fastapi_kit.auth.config import load_config_from_yaml
#   config = load_config_from_yaml("cognito.yaml")

# AWS Cognito Provider Configuration
cognito:
  # AWS Region where User Pool is located
  region: "us-east-1"

  # Cognito User Pool ID
  user_pool_id: "us-east-1_ABC123DEF"

  # Cognito App Client ID
  app_client_id: "abc123def456ghi789"

  # Cognito App Client Secret
  # Supports direct values, file references, or environment variables:
  # - Direct: "my-secret"
  # - File: "file:///run/secrets/cognito-secret"
  # - Environment: "env:COGNITO_APP_CLIENT_SECRET"
  app_client_secret: "file:///run/secrets/cognito-secret"

  # Tenant ID for multi-tenancy
  tenant_id: "default-tenant"

  # Token type to validate: "id" or "access"
  token_type: "id"

# Cache Configuration (optional)
cache:
  # Cache backend: "memory" or "redis"
  backend: "redis"

  # Cache TTL in seconds
  ttl_seconds: 600

  # Redis URL (required if backend is "redis")
  redis_url: "redis://localhost:6379/0"

# Resolver Configuration (optional)
resolver_type: "local"
resolver_merge_strategy: "union"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoaxios-config"
version = "0.2.1"
description = "Shared configuration infrastructure for NeoAxios packages"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "NeoAxios Engineering", email = "engineering@neoaxios.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=5.1",
    "neoaxios-logging>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/neoaxios/neoaxios-starter-kit"
Documentation = "https://github.com/neoaxios/neoaxios-starter-kit/tree/main/neo-packages/foundation/config"
Repository = "https://github.com/neoaxios/neoaxios-starter-kit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neoaxios_config*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoaxios-secure-config"
version = "0.2.1"
description = "Security-hardened configuration package for sensitive settings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "NeoAxios Engineering", email = "engineering@neoaxios.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "neoaxios-logging>=0.2.1",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/neoaxios/neoaxios-starter-kit"
Documentation = "https://github.com/neoaxios/neoaxios-starter-kit/tree/main/neo-packages/foundation/secure_config"
Repository = "https://github.com/neoaxios/neoaxios-starter-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/neoaxios_secure_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "benchmark: performance benchmark tests",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoaxios-resilience-kit"
version = "0.2.1"
description = "Resilience patterns for distributed systems including circuit breakers, retry logic, failure handling, and observability for production environments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "NeoAxios Engineering", email = "engineering@neoaxios.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "neoaxios-logging>=0.2.1",
    "neoaxios-secure-cache>=0.2.1",
    "neoaxios-secure-config>=0.2.1",
    "pydantic>=2.4.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "neoaxios-test-foundation>=0.2.1",  # shared test infra: redis fixtures, stats, namespacing
    "testcontainers[redis]~=4.14.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "testcontainers[redis]~=4.14.1",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/neoaxios/neoaxios-starter-kit"
Documentation = "https://github.com/neoaxios/neoaxios-starter-kit/tree/main/neo-packages/foundation/resilience-kit"
Repository = "https://github.com/neoaxios/neoaxios-starter-kit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neoaxios_resilience_kit*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "bvt: mark test as build verification test (lightweight, fast)",
    "core: mark test as core functionality validation",
    "e2e: mark test as end-to-end requiring real infrastructure",
    "integration: mark test as integration requiring real backends",
    "parallel: mark test as safe for parallel execution",
    "scale: marks tests as scale/performance tests (require real Redis, high concurrency)",
    "unit: mark test as unit test with no external dependencies",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict = false

# Smoke CI for the NeoAxios Starter Kit.
#
# Inter-package dependencies are declared as `neoaxios-X>=0.2.1` against PyPI
# but the kit is not (yet) published, so each package must be installed from
# the working tree. We give pip every editable path in a single resolver run
# so the inter-kit constraints resolve against sibling editables instead of
# trying to fetch from the index.
#
# Each Python version then imports every kit module whose `requires-python`
# floor is satisfied, catching packaging or import-time breakage. Tests do
# not yet live in this repo (see README); when they do, this workflow grows
# a `pytest` step.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install all kit packages (single-pass editable)
        run: |
          python -m pip install --upgrade pip
          # Packages whose `requires-python` floor is above the matrix
          # Python version are dropped from this list — installing them
          # would fail metadata validation. neoaxios-test-foundation
          # currently requires >=3.12.
          PKGS="neo-packages/neoaxios-build \
                neo-packages/logging \
                neo-packages/foundation/config \
                neo-packages/foundation/secure_config \
                neo-packages/foundation/secure_cache \
                neo-packages/foundation/secret_store \
                neo-packages/foundation/resilience-kit \
                neo-packages/foundation/stripe_kit \
                neo-packages/foundation/sse-kit \
                neo-packages/foundation/fastapi_kit"
          if [ "${{ matrix.python }}" = "3.12" ]; then
              PKGS="$PKGS neo-packages/foundation/test-foundation"
          fi
          # Pass every editable path to pip in one resolver run so
          # inter-package `neoaxios-X>=0.2.1` constraints resolve against
          # the sibling editables instead of falling back to PyPI.
          pip install $(printf -- '-e %s ' $PKGS)

      - name: Import smoke test
        run: |
          MODS="neoaxios_logging neoaxios_config neoaxios_secure_config \
                neoaxios_secure_cache neoaxios_secret_store \
                neoaxios_resilience_kit neoaxios_stripe_kit \
                neoaxios_sse_kit neoaxios_fastapi_kit neoaxios.build"
          if [ "${{ matrix.python }}" = "3.12" ]; then
              MODS="$MODS neoaxios_test_foundation"
          fi
          python - <<PY
          import importlib, sys
          mods = "$MODS".split()
          ok = fail = 0
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"  OK    {m}")
                  ok += 1
              except Exception as e:
                  print(f"  FAIL  {m}: {type(e).__name__}: {e}")
                  fail += 1
          print(f"\n{ok}/{ok + fail} modules import cleanly")
          sys.exit(1 if fail else 0)
          PY

  license-check:
    name: license parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap neoaxios-build (needed by Makefile target)
        run: pip install -e neo-packages/neoaxios-build
      - name: Verify per-package LICENSE matches top-level
        run: make license-check

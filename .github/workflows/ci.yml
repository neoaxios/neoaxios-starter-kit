# Per-package install + import smoke test.
#
# Each package is editable-installed into a fresh interpreter and its top-level
# module is imported. This catches dependency-resolution breakage and packaging
# regressions on every push and PR without requiring tests/ directories to
# exist (they don't yet — see README).
#
# The `requires-python` floor is honored per package by matching against the
# matrix Python version; packages whose floor is above the matrix version are
# skipped for that job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install-and-import:
    name: ${{ matrix.package.name }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        package:
          - name: neoaxios-build-system
            path: neo-packages/neoaxios-build
            import: neoaxios.build
            min_python: "3.10"
          - name: neoaxios-logging
            path: neo-packages/logging
            import: neoaxios_logging
            min_python: "3.8"
          - name: neoaxios-config
            path: neo-packages/foundation/config
            import: neoaxios_config
            min_python: "3.8"
          - name: neoaxios-secure-config
            path: neo-packages/foundation/secure_config
            import: neoaxios_secure_config
            min_python: "3.10"
          - name: neoaxios-secure-cache
            path: neo-packages/foundation/secure_cache
            import: neoaxios_secure_cache
            min_python: "3.10"
          - name: neoaxios-secret-store
            path: neo-packages/foundation/secret_store
            import: neoaxios_secret_store
            min_python: "3.11"
          - name: neoaxios-resilience-kit
            path: neo-packages/foundation/resilience-kit
            import: neoaxios_resilience_kit
            min_python: "3.10"
          - name: neoaxios-stripe-kit
            path: neo-packages/foundation/stripe_kit
            import: neoaxios_stripe_kit
            min_python: "3.11"
          - name: neoaxios-test-foundation
            path: neo-packages/foundation/test-foundation
            import: neoaxios_test_foundation
            min_python: "3.12"
          - name: neoaxios-fastapi-kit
            path: neo-packages/foundation/fastapi_kit
            import: neoaxios_fastapi_kit
            min_python: "3.8"
          - name: neoaxios-sse-kit
            path: neo-packages/foundation/sse-kit
            import: neoaxios_sse_kit
            min_python: "3.11"

    steps:
      - name: Skip if Python below package floor
        id: floor-check
        run: |
          if [ "$(printf '%s\n' "${{ matrix.package.min_python }}" "${{ matrix.python }}" | sort -V | head -n1)" != "${{ matrix.package.min_python }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${{ matrix.package.name }} requires >=${{ matrix.package.min_python }}, matrix is ${{ matrix.python }}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.floor-check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.floor-check.outputs.skip != 'true'
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package (editable)
        if: steps.floor-check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ${{ matrix.package.path }}

      - name: Import smoke test
        if: steps.floor-check.outputs.skip != 'true'
        run: python -c "import ${{ matrix.package.import }}"

  license-check:
    name: license parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap neoaxios-build (needed by Makefile target)
        run: pip install -e neo-packages/neoaxios-build
      - name: Verify per-package LICENSE matches top-level
        run: make license-check
